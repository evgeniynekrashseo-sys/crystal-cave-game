name: ChemLab Laboratory — signed iOS App Store / TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload signed ChemLab IPA to App Store Connect TestFlight"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: chemlab-ios-release
  cancel-in-progress: false

jobs:
  signed-ipa:
    runs-on: macos-26
    environment: ios-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate game and prepare standalone iOS application
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run native:lab -- ios
          test -s dist/lab/lab-localization.js
          node --input-type=module -e "import{readFile}from'node:fs/promises';const h=await readFile('dist/lab/index.html','utf8');const a=await readFile('dist/lab/app.js','utf8');if(/id=\"city-button\"|settlement\.css/.test(h)||/import \{initCity\}/.test(a))throw Error('City present in standalone ChemLab package')"

      - name: Check signing prerequisites
        env:
          P12: ${{ secrets.CHEMLAB_IOS_DISTRIBUTION_P12_BASE64 }}
          PASS: ${{ secrets.CHEMLAB_IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.CHEMLAB_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${P12:?Missing CHEMLAB_IOS_DISTRIBUTION_P12_BASE64}"
          : "${PASS:?Missing CHEMLAB_IOS_DISTRIBUTION_P12_PASSWORD}"
          : "${PROFILE:?Missing CHEMLAB_IOS_PROVISIONING_PROFILE_BASE64}"
          xcodebuild -version

      - name: Import ChemLab App Store signing identity
        env:
          P12: ${{ secrets.CHEMLAB_IOS_DISTRIBUTION_P12_BASE64 }}
          PASS: ${{ secrets.CHEMLAB_IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.CHEMLAB_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/chemlab-dist.p12"
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/chemlab-profile.mobileprovision"

          keychain="$RUNNER_TEMP/chemlab-sign.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" /Library/Keychains/System.keychain
          security default-keychain -s "$keychain"
          security import "$RUNNER_TEMP/chemlab-dist.p12" -f pkcs12 -t cert -k "$keychain" -P "$PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

          security cms -D -i "$RUNNER_TEMP/chemlab-profile.mobileprovision" > "$RUNNER_TEMP/chemlab-profile.plist"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/chemlab-profile.plist")"
          if [ "$app_id" != "QX87B6Q3N7.com.digitaldavinci.chemlab" ]; then
            echo "Profile does not match ChemLab: com.digitaldavinci.chemlab" >&2
            exit 1
          fi
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/chemlab-profile.plist")"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/chemlab-profile.plist")"
          install_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$install_dir"
          cp "$RUNNER_TEMP/chemlab-profile.mobileprovision" "$install_dir/$uuid.mobileprovision"
          echo "CHEMLAB_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "CHEMLAB_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Build signed iOS App Store archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChemLab.xcarchive" \
            DEVELOPMENT_TEAM=QX87B6Q3N7 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$CHEMLAB_PROFILE_NAME" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'teamID': 'QX87B6Q3N7',
              'provisioningProfiles': {
                  'com.digitaldavinci.chemlab': os.environ['CHEMLAB_PROFILE_NAME']
              },
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'ChemLabExportOptions.plist'
          with output.open('wb') as file:
              plistlib.dump(options, file)
          PY
          plutil -lint "$RUNNER_TEMP/ChemLabExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/ChemLab.xcarchive" \
            -exportPath "$RUNNER_TEMP/chemlab-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ChemLabExportOptions.plist"
          test -n "$(find "$RUNNER_TEMP/chemlab-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Export IPA artifact for release QA
        uses: actions/upload-artifact@v4
        with:
          name: chemlab-lab-app-store-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/chemlab-ipa/*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Upload IPA to App Store Connect (TestFlight only)
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.CHEMLAB_ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.CHEMLAB_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.CHEMLAB_ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_API_KEY_P8_BASE64:?Missing CHEMLAB_ASC_API_KEY_P8_BASE64}"
          : "${ASC_API_KEY_ID:?Missing CHEMLAB_ASC_API_KEY_ID}"
          : "${ASC_API_ISSUER_ID:?Missing CHEMLAB_ASC_API_ISSUER_ID}"
          auth_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$auth_dir"
          chmod 700 "$auth_dir"
          key_file="$auth_dir/AuthKey_${ASC_API_KEY_ID}.p8"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$key_file"
          chmod 600 "$key_file"
          ipa="$(find "$RUNNER_TEMP/chemlab-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Remove temporary signing assets
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/chemlab-sign.keychain-db"
          if [ -n "${CHEMLAB_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$CHEMLAB_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/chemlab-dist.p12" "$RUNNER_TEMP/chemlab-profile.mobileprovision" "$RUNNER_TEMP/chemlab-profile.plist"
