name: ChemLab reference parity screenshots
on:
  push:
    branches: [feature/reference-parity-loop]
  pull_request:
    paths:
      - 'dist/city-art-sandbox.html'
      - 'dist/settlement-*.js'
      - 'dist/city-nature-sprites.js'
      - 'dist/city-terrain-detail.js'
      - 'docs/city/**'
      - '.github/workflows/reference-parity.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/chemlab-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8765/city-art-sandbox.html >/dev/null && break; sleep 1; done
      - name: Capture phone-sized screenshots
        run: |
          mkdir -p artifacts/city
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const failures=[];
          for(const [name,width,height] of [['portrait',390,844],['landscape',844,390]]){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://localhost:8765/city-art-sandbox.html',{waitUntil:'networkidle'});
            await page.waitForTimeout(1500);
            await page.screenshot({path:'artifacts/city/'+name+'.png'});
            const treeState=await page.locator('html').getAttribute('data-tree-sprites');
            if(treeState!=='ready')failures.push(name+': detailed tree sprites not ready ('+treeState+')');
            if(errors.length)failures.push(name+': '+errors.join('; '));
            await page.close();
          }
          await browser.close();
          if(failures.length)throw new Error(failures.join('\n'));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chemlab-mobile-visual-evidence
          path: artifacts/city/*.png
          retention-days: 30
