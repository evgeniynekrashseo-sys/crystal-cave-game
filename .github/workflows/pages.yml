name: Deploy Crystal Cave to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ChemLab visual polish
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("index.html", "game.html"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              links = [
                  '<link rel="stylesheet" href="polish-v6.css">',
                  '<link rel="stylesheet" href="liquid-v7.css">'
              ]
              for link in links:
                  if link not in s:
                      s = s.replace('</head>', link + '</head>')
              script = '<script src="liquid-v7.js"></script>'
              if script not in s:
                  s = s.replace('</body>', script + '</body>')
              p.write_text(s, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
