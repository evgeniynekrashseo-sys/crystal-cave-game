name: ChemLab iOS - TestFlight release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemlab-ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign and upload city-free ChemLab
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APP_BUNDLE_ID: com.digitaldavinci.chemlab
      APPLE_TEAM_ID: QX87B6Q3N7
      PROVISIONING_PROFILE_NAME: ChemLab_AppStore_2026
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and run tests
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Prepare city-free native iOS project
        run: |
          set -euo pipefail
          npm run native:lab -- ios
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f dist/lab/lab-localization.js
          xcodebuild -version

      - name: Import signing certificate and provisioning profile
        env:
          CERT_B64: ${{ secrets.CHEMLAB_IOS_DISTRIBUTION_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.CHEMLAB_IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.CHEMLAB_IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          for name in CERT_B64 CERT_PASSWORD PROFILE_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for ${name}"
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/chemlab-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/chemlab-distribution.p12"
          printf '%s' "$CERT_B64" | base64 -D > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/ChemLab_AppStore_2026.mobileprovision"
          printf '%s' "$PROFILE_B64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/chemlab-profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/chemlab-profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/chemlab-profile.plist")
          if [ "$PROFILE_NAME" != "$PROVISIONING_PROFILE_NAME" ] || [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]; then
            echo "::error::Wrong provisioning profile for ChemLab"
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "ChemLab iOS build 1.2.1 (${BUILD_NUMBER})"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChemLab.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            MARKETING_VERSION=1.2.1 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ChemLabExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>QX87B6Q3N7</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.digitaldavinci.chemlab</key><string>ChemLab_AppStore_2026</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ChemLab.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ChemLabExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/chemlab-ipa"
          test -n "$(find "$RUNNER_TEMP/chemlab-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload build to App Store Connect and TestFlight
        env:
          API_P8_B64: ${{ secrets.CHEMLAB_ASC_API_KEY_P8_B64 }}
          API_KEY_ID: ${{ secrets.CHEMLAB_ASC_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.CHEMLAB_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in API_P8_B64 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for ${name}"
              exit 1
            fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_P8_B64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA_PATH="$(find "$RUNNER_TEMP/chemlab-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Preserve IPA and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemlab-ios-testflight-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/chemlab-ipa/*.ipa
            ${{ runner.temp }}/chemlab-ipa/Packaging.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/chemlab-distribution.p12" "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/chemlab-signing.keychain-db" 2>/dev/null || true
