<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#121525"><title>CHAOS SORT — Black Orange Groupe</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font:500 15px system-ui;background:radial-gradient(ellipse at top,#263257,#0a0d1d 75%);min-height:100dvh}main{max-width:480px;padding:15px;margin:auto}header,.stats,.actions,.tray,.shelf{display:flex;align-items:center;justify-content:space-between;gap:7px}h1{font-size:27px;letter-spacing:2px;margin:8px 0}small{color:#aab7d4}.tag{background:#ffffff12;border:1px solid #ffffff25;padding:8px 12px;border-radius:12px}.stats{margin:16px 0}.stats .tag{flex:1;text-align:center}h2{text-align:center;margin:18px 0 5px;font-size:21px}.sub{text-align:center;color:#aab7d4;margin-bottom:22px}.shelf{position:relative;justify-content:center;min-height:82px;border-bottom:9px solid #906a4e;background:linear-gradient(#ffffff08,#ffffff02);border-radius:12px;margin:8px 0;padding:5px 12px 8px;box-shadow:0 9px 12px #0004}.item{border:0;border-radius:16px;width:59px;height:62px;flex:0 0 59px;background:linear-gradient(155deg,#ffffff35,#ffffff08);color:#fff;font-size:37px;text-shadow:0 3px 8px #0008;box-shadow:inset 0 1px 2px #fff7,0 5px 8px #0005;cursor:pointer;transition:transform .14s}.item:active{transform:scale(.88)}.item:disabled{opacity:.18;cursor:default}.tray{justify-content:center;margin-top:12px;background:#080b18a8;padding:12px 7px;border:1px solid #ffffff30;border-radius:17px;min-height:72px}.slot{display:grid;place-items:center;flex:1;background:#ffffff0a;border:1px dashed #ffffff28;border-radius:12px;min-height:49px;font-size:29px}.actions{margin-top:15px}.actions button,#next{flex:1;background:#303e65;color:white;border:1px solid #647499;border-radius:12px;padding:13px 5px;font-weight:800;cursor:pointer}.actions button:disabled{opacity:.3}#next{background:#ffba39;color:#211a17;width:100%;font-size:17px;margin-top:12px}.footer{text-align:center;margin-top:16px;color:#7f91bb;font-size:11px}.top{display:flex;justify-content:space-between;align-items:center}.pill{color:#fcca6d}.overlay{position:fixed;inset:0;background:#070914dd;display:none;place-items:center;padding:25px;z-index:3}.panel{width:100%;max-width:380px;background:#1b2645;border:1px solid #6984b6;border-radius:25px;padding:26px;text-align:center;box-shadow:0 18px 60px #000a}.panel h2{font-size:27px}.panel p{color:#c5d3e9;line-height:1.5}#status{min-height:22px;text-align:center;color:#ffca73;font-size:13px}#share{cursor:pointer}button:focus-visible{outline:3px solid #ffca73}header strong{color:#ffbf4e}</style><main><header><div><small>BLACK ORANGE GROUPE</small><h1>CHAOS <strong>SORT</strong></h1></div><button class="tag" id="share">↗ Share</button></header><div class="stats"><div class="tag">LEVEL<br><b id="level">1</b></div><div class="tag">COINS<br><b id="coins">0</b> 🪙</div><div class="tag">LEFT<br><b id="left">0</b></div></div><h2>Match 3 objects</h2><div class="sub">Tap the front item on each shelf. Don't fill the tray!</div><div id="board"></div><div id="status" role="status"></div><div class="top"><b>YOUR TRAY</b><small><span id="count">0</span> / 7 slots</small></div><div class="tray" id="tray"></div><div class="actions"><button id="undo">↶ Undo</button><button id="shuffle">⤨ Shuffle</button><button id="hint">✦ Hint</button></div><div class="footer">Original mobile puzzle prototype · Progress saves on this device</div></main><div class="overlay" id="overlay"><div class="panel"><div style="font-size:64px" id="outEmoji">🏆</div><h2 id="outTitle">Level complete!</h2><p id="outText"></p><button id="next">CONTINUE</button></div></div><script>(()=>{const $=id=>document.getElementById(id),icons=['🍋','🍒','🥑','🍩','🧸','🎲','🍉','🍄','💎','🪄','⭐','🎁','🧪','🛸','🐸'];const saveKey='chaos-sort-groupe-v3';let saved={};try{saved=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch(e){};let lvl=Number(saved.level)||1,coins=Number(saved.coins)||0,rows=[],tray=[],history=[],over=false;function rng(seed){let x=seed|0;return()=>{x|=0;x=x+0x6D2B79F5|0;let z=Math.imul(x^x>>>15,1|x);z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296}}function persist(){try{localStorage.setItem(saveKey,JSON.stringify({level:lvl,coins}))}catch(e){}}function start(){const r=rng(lvl*9871+27),k=Math.min(4+Math.floor(lvl/3),9),pairs= Math.min(6+Math.floor(lvl/2),12),pool=[];for(let i=0;i<pairs;i++){const a=icons[i%k];for(let j=0;j<3;j++)pool.push(a)}for(let i=pool.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}rows=Array.from({length:5},()=>[]);pool.forEach((x,i)=>rows[i%5].push(x));tray=[];history=[];over=false;$('overlay').style.display='none';render()}function render(){const n=rows.reduce((a,x)=>a+x.length,0);$('level').textContent=lvl;$('coins').textContent=coins;$('left').textContent=n;$('count').textContent=tray.length;$('board').innerHTML='';rows.forEach((r,i)=>{const row=document.createElement('div');row.className='shelf';const active=r[r.length-1];for(let j=0;j<5;j++){const b=document.createElement('button');b.className='item';b.textContent=(j===2&&active)||'·';b.disabled=j!==2||!active;if(!b.disabled)b.onclick=()=>pick(i);row.appendChild(b)}$('board').appendChild(row)});$('tray').innerHTML='';for(let i=0;i<7;i++){const s=document.createElement('div');s.className='slot';s.textContent=tray[i]||'';$('tray').appendChild(s)}$('undo').disabled=!history.length||over;$('shuffle').disabled=over;$('hint').disabled=over}function pick(i){if(over||!rows[i].length)return;history.push({rows:rows.map(x=>x.slice()),tray:tray.slice(),coins});const x=rows[i].pop();tray.push(x);if(tray.filter(z=>z===x).length===3){tray=tray.filter(z=>z!==x);coins+=5;$('status').textContent='✨ MATCH! +5 coins'}else $('status').textContent='';render();if(rows.every(r=>!r.length)&&!tray.length){over=true;coins+=50;persist();show(true)}else if(tray.length>=7){over=true;show(false)}}function show(win){$('overlay').style.display='grid';$('outEmoji').textContent=win?'🏆':'💥';$('outTitle').textContent=win?'Level complete!':'Tray is full!';$('outText').textContent=win?'Excellent sorting! +50 coins. Ready for the next challenge?':'Try a different order or use Undo to escape the chaos.';$('next').textContent=win?'NEXT LEVEL':'RETRY LEVEL';$('next').onclick=()=>{if(win)lvl++;persist();start()}}$('undo').onclick=()=>{if(!history.length)return;const s=history.pop();rows=s.rows;tray=s.tray;coins=s.coins;over=false;$('overlay').style.display='none';$('status').textContent='↶ Move undone';render()};$('shuffle').onclick=()=>{if(over)return;const a=rows.flat(),r=rng(Date.now());for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}rows=Array.from({length:5},()=>[]);a.forEach((v,i)=>rows[i%5].push(v));history=[];$('status').textContent='⤨ Shelves shuffled';render()};$('hint').onclick=()=>{const d={};tray.forEach(x=>d[x]=(d[x]||0)+1);let best=-1,score=-1;rows.forEach((r,i)=>{if(!r.length)return;const s=d[r[r.length-1]]||0;if(s>score){score=s;best=i}});$('status').textContent=best<0?'No move available':'✦ Try shelf '+(best+1)+' next!'};$('share').onclick=async()=>{const data={title:'CHAOS SORT',text:'Can you beat my level '+lvl+' in CHAOS SORT?',url:location.href};try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(data.text+' '+data.url);$('status').textContent='Link copied!'}}catch(e){}};start()})()</script></html>
