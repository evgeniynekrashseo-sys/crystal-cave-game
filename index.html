<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ChemLab — Sort & React</title><style>html,body{margin:0;width:100%;height:100%;background:#030508;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#030508}</style></head><body><iframe id="game" src="game.html?v=3" title="ChemLab"></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{const d=f.contentDocument;const s=d.createElement('style');s.textContent=`.rim{width:70px!important;height:14px!important;border-radius:50%!important;margin-bottom:-7px!important;z-index:6!important;background:radial-gradient(ellipse at 50% 35%,#f5fbff 0 24%,#b8daf2 25% 42%,#5d82a0 48%,#203345 68%,#0b1420 100%)!important;border:1px solid #bde6ff99!important;box-shadow:0 0 15px #69d9ff44,inset 0 2px 3px #fff9,inset 0 -3px 5px #000a!important}.tube{width:68px!important;height:230px!important;border-radius:8px 8px 34px 34px!important;border:2px solid #9ed7ff80!important;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.035) 28%,rgba(11,19,30,.24) 64%,rgba(2,7,13,.58) 100%)!important;box-shadow:0 0 20px #18d8ff1f,inset 9px 0 16px rgba(255,255,255,.08),inset -7px 0 14px rgba(0,0,0,.45),inset 0 -10px 18px rgba(70,120,160,.08)!important}.tube:before{inset:3px!important;border:1px solid rgba(235,248,255,.13)!important;border-radius:6px 6px 31px 31px!important;box-shadow:inset 0 0 18px rgba(116,192,255,.05)!important}.tube:after{left:7px!important;top:9px!important;bottom:28px!important;width:5px!important;background:linear-gradient(rgba(255,255,255,.78),rgba(255,255,255,.15) 42%,transparent 76%)!important}.tube canvas{inset:5px!important;width:calc(100% - 10px)!important;height:calc(100% - 10px)!important;border-radius:4px 4px 28px 28px!important}.board{min-height:410px!important;gap:24px 16px!important}.el i{box-shadow:0 0 9px currentColor!important}@media(max-width:480px){.board{min-height:350px!important;gap:20px 9px!important;padding-left:6px!important;padding-right:6px!important}.tube{width:56px!important;height:190px!important;border-radius:7px 7px 28px 28px!important}.rim{width:59px!important;height:12px!important;margin-bottom:-6px!important}}`;d.head.appendChild(s);const recolor=()=>{d.querySelectorAll('.el').forEach(el=>{const t=el.textContent.trim();const i=el.querySelector('i');if(!i)return;const map={Na:'#ff5148',Cl:'#35e97d',Fe:'#ffb33f',O:'#39bff5',C:'#a661ec',H:'#68dfe2',Au:'#ffd84f'};if(map[t]){i.style.background=map[t];i.style.boxShadow='0 0 10px '+map[t]+'88'}})};recolor();new MutationObserver(recolor).observe(d.body,{childList:true,subtree:true});});</script></body></html>
