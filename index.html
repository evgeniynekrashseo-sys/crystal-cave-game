<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ChemLab — Sort & React</title><link rel="stylesheet" href="polish-v6.css"><link rel="stylesheet" href="liquid-v7.css"><link rel="stylesheet" href="reference-v8.css"></head><body><div class="edge l"></div><div class="edge r"></div><main class="app"><header class="top"><div class="brand">ChemLab<small>Sort & React</small></div><div class="tools"><div class="pill"><span class="coin"></span><span id="gold">0</span></div><div class="pill"><span class="coin s"></span><span id="nugget">0</span></div><button class="icon" id="sound">⚛</button><button class="icon" id="quests">⚙</button></div></header><section class="status"><div><h1 id="levelTitle">Дослід 1</h1><p id="levelSub">Реагенти</p></div><div class="moves"><b id="moves">18</b><span>ХОДІВ</span></div></section><section class="rank"><span>🧪 <strong id="rankName">Учень алхімік</strong></span><div class="xp"><i id="xpFill"></i></div><span class="xplabel" id="xpText">0 / 120 XP</span></section><div class="hint" id="hint">Торкнись колби, щоб обрати реагент</div><section class="tray" id="tray"></section><section class="board" id="board"></section><section class="controls"><button class="btn" id="undo"><span class="ico">↶</span><span class="badge" id="undoBadge">3</span>Скасувати</button><button class="btn" id="shuffle"><span class="ico">⟳</span><span class="badge" id="shuffleBadge">3</span>Перемішати</button><button class="btn" id="addTube"><span class="ico">⚗+</span><span class="badge">+1</span>Додати колбу</button><button class="btn" id="hintBtn"><span class="ico">💡</span><span class="badge" id="hintBadge">3</span>Підказка</button></section><section class="station" id="station"><div class="rig"><i class="stand"></i><i class="bar"></i><i class="flask"></i><i class="fire">🔥</i><i class="receiver"></i></div><div><div class="stationTitle">ДИСТИЛЯЦІЙНА СТАНЦІЯ</div><div class="recipe" id="recipe"></div><small id="unlockText"></small></div></section><footer class="footer"><div>▣ Лабораторні нотатки</div><div class="center">КОЖНА РЕАКЦІЯ МАЄ ЗНАЧЕННЯ</div><div class="right" id="footerLevel">Рівень 1 з 50 ›</div></footer></main><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="nextBtn">Наступний дослід</button><button class="secondary" id="replayBtn">Повторити</button></div></div><div class="toast" id="toast"></div><script src="game.js"></script><script src="liquid-v7.js"></script></body></html>
