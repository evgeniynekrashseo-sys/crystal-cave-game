<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ChemLab City · Art Sandbox</title><style>*{box-sizing:border-box}body{margin:0;background:#152019;color:#f5e8c7;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;gap:6px}header span,.panel{background:#121b17d9;border:1px solid #bca87966;border-radius:12px;padding:10px;backdrop-filter:blur(8px)}.panel{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:7px;overflow:auto}button{background:#2c3b2d;color:#f5e8c7;border:1px solid #bca87966;border-radius:9px;padding:11px;white-space:nowrap;font:inherit}button.active{background:#78633b}small{opacity:.7}#status{position:absolute;top:70px;left:12px;color:#fff8;text-shadow:0 1px 3px #000}</style></head><body><canvas id="world"></canvas><header><span><b>ChemLab City</b><br><small>Пісочниця · мобільний прототип</small></span><span>🌲 Ліс · 🪨 Камінь · 🏠 Будівництво</span></header><div id="status">Один палець — рух · два — масштаб</div><div class="panel"><button data-tool="view" class="active">✋ Огляд</button><button data-tool="house">🏠 Будинок</button><button data-tool="tree">🌲 Дерево</button><button data-tool="road">🛤️ Дорога</button><button data-tool="site">🪵 Будівництво</button><button id="upgrade">⬆️ Розвинути будинок</button><button id="reset">↺ Скинути</button></div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
let W=0,H=0,dpr=1,zoom=1,panX=0,panY=0,tool='view',selected=null;
const assets={};for(const [name,file] of Object.entries({buildings:'city-architecture-v42.webp',nature:'world-nature-v34.webp',coherent:'world-buildings-v34.webp',roads:'settlement-details-alpha.png',ground:'terrain-meadow-v36.webp'})){let im=new Image();im.src=file;assets[name]=im;}
const base=[{type:'house',x:5,y:5,level:3},{type:'house',x:9,y:7,level:2},{type:'site',x:11,y:4,level:1},{type:'house',x:4,y:10,level:1},{type:'site',x:13,y:10,level:1}];
let objects=[],roads=[];function reset(){objects=structuredClone(base);for(let i=0;i<80;i++){let x=(i*13+3)%19,y=(i*7+Math.floor(i/4)*3)%19;if((x-8)**2+(y-8)**2<20)continue;objects.push({type:'tree',x,y,level:i%4})}roads=[];for(let i=3;i<17;i++){roads.push({x:i,y:8});roads.push({x:8,y:i})}selected=null}reset();
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function point(x,y){let u=Math.min(55,Math.max(35,W*.09))*zoom;return {x:W/2+(x-y)*u+panX,y:H*.24+(x+y)*u*.53+panY}}function inverse(px,py){let u=Math.min(55,Math.max(35,W*.09))*zoom,a=(px-W/2-panX)/u,b=(py-H*.24-panY)/(u*.53);return {x:(a+b)/2,y:(b-a)/2}}
function rand(x,y,n=0){let v=Math.sin(x*127.1+y*311.7+n*71.7)*43758.5453;return v-Math.floor(v)}
function diamond(x,y,color){let a=point(x,y),b=point(x+1,y),c=point(x+1,y+1),d=point(x,y+1);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function sprite(img,col,row,rows,cols,x,y,w,scale=1){if(!img?.complete||!img.naturalWidth)return false;let sw=img.naturalWidth/cols,sh=img.naturalHeight/rows,p=point(x+.5,y+.65),dw=w*zoom*scale,dh=dw*sh/sw;ctx.drawImage(img,col*sw,row*sh,sw,sh,p.x-dw/2,p.y-dh,dw,dh);return true}
function tree(o){let p=point(o.x+.5,o.y+.6),u=zoom*28,h=(2.3+o.level*.28)*u;ctx.fillStyle='#403b26';ctx.fillRect(p.x-2*zoom,p.y-h*.38,4*zoom,h*.38);for(let i=0;i<5;i++){let t=i/5;ctx.beginPath();ctx.moveTo(p.x,p.y-h+t*h*.68);ctx.lineTo(p.x-(h*.25)*(1-t*.5),p.y-h*.1+t*h*.7);ctx.lineTo(p.x+(h*.25)*(1-t*.5),p.y-h*.1+t*h*.7);ctx.closePath();ctx.fillStyle=['#283e2d','#38543a','#435d3c'][i%3];ctx.fill()} }
function draw(){ctx.fillStyle='#61734a';ctx.fillRect(0,0,W,H);let tile=assets.ground;if(tile.complete&&tile.naturalWidth){ctx.globalAlpha=.38;let w=tile.naturalWidth*.36*zoom;for(let y=-1;y<Math.ceil(H/w)+2;y++)for(let x=-1;x<Math.ceil(W/w)+2;x++)ctx.drawImage(tile,x*w+panX%w,y*w+panY%w,w,w);ctx.globalAlpha=1}
for(let x=0;x<20;x++)for(let y=0;y<20;y++){let r=rand(x,y);if(r>.82)diamond(x,y,'#87764a20');else if(r<.1)diamond(x,y,'#283f2820')}
for(let r of roads){let p=point(r.x+.5,r.y+.5),u=Math.min(55,Math.max(35,W*.09))*zoom;
 // Narrow feathered earth track; no square or diamond tiles.
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.49);
 for(let layer=0;layer<3;layer++){ctx.strokeStyle=['rgba(74,65,44,.14)','rgba(125,103,73,.24)','rgba(159,135,94,.28)'][layer];ctx.lineWidth=[u*.48,u*.37,u*.28][layer];ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-u*.65,0);ctx.quadraticCurveTo(0,Math.sin(r.x*3+r.y)*u*.07,u*.65,0);ctx.stroke()}
 for(let i=0;i<11;i++){let dx=(rand(r.x,r.y,i)-.5)*u*1.1,dy=(rand(r.y,r.x,i)-.5)*u*.22;ctx.fillStyle=i%2?'#61553c88':'#b5a47b99';ctx.beginPath();ctx.ellipse(dx,dy,(1+rand(i,r.x))*zoom,zoom*.6,0,0,7);ctx.fill()}ctx.restore()}
for(let o of [...objects].sort((a,b)=>a.x+a.y-b.x-b.y)){if(o.type==='tree'){tree(o)}else if(o.type==='house'){let level=Math.min(4,Math.max(1,o.level));if(!sprite(assets.buildings,level-1,0,4,4,o.x,o.y,130,1.3)){let p=point(o.x+.5,o.y+.5);ctx.fillStyle='#a1845d';ctx.fillRect(p.x-20*zoom,p.y-45*zoom,40*zoom,45*zoom);ctx.fillStyle='#795132';ctx.beginPath();ctx.moveTo(p.x-28*zoom,p.y-45*zoom);ctx.lineTo(p.x,p.y-75*zoom);ctx.lineTo(p.x+28*zoom,p.y-45*zoom);ctx.fill()}}else{let p=point(o.x+.5,o.y+.5);diamond(o.x,o.y,'#aaa28b');ctx.strokeStyle='#6c6050';ctx.lineWidth=5*zoom;ctx.strokeRect(p.x-17*zoom,p.y-15*zoom,34*zoom,18*zoom);for(let i=-1;i<=1;i++){ctx.strokeStyle='#8b5d34';ctx.lineWidth=3*zoom;ctx.beginPath();ctx.moveTo(p.x+i*12*zoom,p.y);ctx.lineTo(p.x+i*12*zoom,p.y-35*zoom);ctx.stroke()}}if(selected===o){let p=point(o.x+.5,o.y+.6);ctx.strokeStyle='#ffe7a3';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,45*zoom,18*zoom,0,0,7);ctx.stroke()}}
requestAnimationFrame(draw)}draw();
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));status.textContent=tool==='view'?'Торкнись будинку, щоб вибрати':'Торкнись землі, щоб додати об’єкт'});
document.querySelector('#upgrade').onclick=()=>{if(selected?.type==='house')selected.level=selected.level%4+1;else status.textContent='Спочатку вибери будинок у режимі огляду'};document.querySelector('#reset').onclick=()=>{reset();panX=panY=0;zoom=1};
let touches=new Map(),start=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1)start={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false}});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1&&start){panX=start.px+e.clientX-start.x;panY=start.py+e.clientY-start.y;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>8)start.moved=true}else if(touches.size===2){let pts=[...touches.values()],a=pts[0],b=pts[1],old=Math.hypot(a.x-(a===pts[0]&&prev!==a?prev.x:b.x),a.y-(a===pts[0]&&prev!==a?prev.y:b.y));let d=Math.hypot(a.x-b.x,a.y-b.y);if(old>5)zoom=Math.max(.5,Math.min(2.3,zoom*d/old));start=null}});
canvas.addEventListener('pointerup',e=>{if(start&&!start.moved&&touches.size===1){let p=inverse(e.clientX,e.clientY),x=Math.round(p.x-.5),y=Math.round(p.y-.5);if(tool==='view'){selected=[...objects].reverse().find(o=>Math.abs(o.x-x)<1.5&&Math.abs(o.y-y)<1.5)||null;status.textContent=selected?'Будівля вибрана · можна підвищити рівень':'Обери будівлю'}else if(x>=0&&y>=0&&x<20&&y<20){if(tool==='road')roads.push({x,y});else objects.push({type:tool,x,y,level:1})}}touches.delete(e.pointerId);start=null});canvas.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);start=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.3,zoom*(e.deltaY>0?.9:1.1)))},{passive:false});
</script></body></html>
