<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ChemLab — розробка 3D-міста</title>
<style>*{box-sizing:border-box}body{margin:0;background:#252e27;color:#eee7d6;font:14px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header,footer{position:fixed;left:16px;right:16px;background:#252e27e8;border:1px solid #a99e6c55;border-radius:8px;padding:12px;backdrop-filter:blur(12px)}header{top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px}strong{font:600 22px Georgia}small{display:block;color:#c0bdac;margin-top:4px}footer{bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a{background:#656847;color:#fff6dc;border:1px solid #9c9b74;border-radius:5px;padding:9px 13px;text-decoration:none;cursor:pointer}#status{flex:1;min-width:140px}#error{position:fixed;inset:30%;background:#252e27;padding:24px;display:none}</style>
